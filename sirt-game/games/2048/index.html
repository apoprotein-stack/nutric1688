<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>2048 · Brain Lab</title>
<style>
:root {
  --bg: #0b1220;
  --panel: #121a2b;
  --cell: rgba(255,255,255,.06);
  --text: #eef3ff;
  --muted: #9aa8c7;
  --accent: #6ee7ff;
  --accent2: #a78bfa;
  --warm: #fbbf24;
  --radius: 12px;
  font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  color: var(--text);
  background:
    radial-gradient(900px 500px at 15% -10%, rgba(110,231,255,.16), transparent 55%),
    radial-gradient(700px 400px at 90% 0%, rgba(167,139,250,.14), transparent 50%),
    linear-gradient(180deg, var(--bg), #0e1628);
  min-height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  user-select: none;
  -webkit-user-select: none;
  overflow-x: hidden;
}
a { color: var(--accent); text-decoration: none; }
.top {
  width: min(420px, 100%);
  padding: 14px 16px 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; }
.back {
  font-size: 13px; color: var(--muted); padding: 6px 10px; border-radius: 999px;
  background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1);
}
.back:hover { color: var(--text); }
.wrap { width: min(420px, 100%); padding: 0 16px 28px; }
.header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.header h1 {
  margin: 0; font-size: 36px; letter-spacing: 1px;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  -webkit-background-clip: text; background-clip: text; color: transparent; line-height: 1;
}
.subtitle { margin: 6px 0 0; font-size: 12px; color: var(--muted); }
.scores { display: flex; gap: 8px; }
.score-box {
  background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.1);
  border-radius: 10px; padding: 8px 12px; text-align: center; min-width: 72px;
}
.score-box .label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
.score-box .val { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--warm); }
.toolbar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
button {
  font: inherit; border: 0; cursor: pointer; border-radius: 10px; padding: 9px 14px;
  font-weight: 700; font-size: 13px; transition: transform .08s, opacity .12s;
}
button:active { transform: translateY(1px); }
.btn-primary {
  color: #0b1220; background: linear-gradient(135deg, var(--accent), #38bdf8);
  box-shadow: 0 4px 14px rgba(56,189,248,.25);
}
.btn-ghost { color: var(--text); background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12); }
.btn-ghost:disabled { opacity: .4; cursor: not-allowed; }
.hint { font-size: 12px; color: var(--muted); margin: 0 0 12px; line-height: 1.5; }
.dpad { display: flex; flex-direction: column; align-items: center; gap: 6px; margin: 0 0 14px; }
.dpad-mid { display: flex; gap: 6px; align-items: center; }
.dpad-btn {
  width: 52px; height: 44px; font-size: 18px; color: var(--text);
  background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.14);
  border-radius: 10px; cursor: pointer; font-weight: 700; user-select: none;
  -webkit-user-select: none; touch-action: manipulation;
}
.dpad-btn:active { background: rgba(110,231,255,.25); transform: translateY(1px); }
.board-wrap { position: relative; width: 100%; aspect-ratio: 1; max-width: 400px; margin: 0 auto; }
.board {
  position: absolute; inset: 0; background: rgba(0,0,0,.35); border-radius: 14px; padding: 8px;
  display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr);
  gap: 8px; touch-action: none;
}
.cell { background: var(--cell); border-radius: 8px; }
.tiles { position: absolute; inset: 8px; pointer-events: none; }
.tile {
  position: absolute; width: calc((100% - 24px) / 4); height: calc((100% - 24px) / 4);
  border-radius: 8px; display: grid; place-items: center; font-weight: 800;
  font-size: clamp(18px, 6.5vw, 28px); transition: left .12s ease, top .12s ease, transform .12s ease;
  box-shadow: 0 2px 6px rgba(0,0,0,.25);
}
.t2 { background: #1e3a5f; color: #dbeafe; }
.t4 { background: #1e4d6b; color: #e0f2fe; }
.t8 { background: #0e7490; color: #fff; }
.t16 { background: #0891b2; color: #fff; }
.t32 { background: #06b6d4; color: #0b1220; }
.t64 { background: #22d3ee; color: #0b1220; }
.t128 { background: #7c3aed; color: #fff; font-size: clamp(16px, 5.5vw, 24px); }
.t256 { background: #8b5cf6; color: #fff; font-size: clamp(16px, 5.5vw, 24px); }
.t512 { background: #a78bfa; color: #0b1220; font-size: clamp(16px, 5.5vw, 24px); }
.t1024 { background: #f59e0b; color: #0b1220; font-size: clamp(14px, 5vw, 20px); }
.t2048 { background: linear-gradient(135deg, #fbbf24, #f59e0b); color: #0b1220; font-size: clamp(14px, 5vw, 20px); box-shadow: 0 0 20px rgba(251,191,36,.45); }
.t4096, .t8192 { background: linear-gradient(135deg, #ef4444, #dc2626); color: #fff; font-size: clamp(12px, 4.5vw, 18px); }
.overlay {
  position: absolute; inset: 0; display: none; place-items: center;
  background: rgba(8,14,28,.72); backdrop-filter: blur(4px); border-radius: 14px; z-index: 10;
}
.overlay.show { display: grid; }
.card {
  background: #fffdf8; color: #1e293b; border-radius: 16px; padding: 22px 26px;
  text-align: center; max-width: 88%; box-shadow: 0 16px 40px rgba(0,0,0,.4);
}
.card h2 { margin: 0 0 8px; font-size: 22px; color: #0f766e; }
.card p { margin: 0 0 16px; font-size: 14px; line-height: 1.55; color: #475569; }
.card .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.card button { color: #0b1220; background: linear-gradient(135deg, #6ee7ff, #38bdf8); }
.footer-note { margin-top: 14px; text-align: center; font-size: 11px; color: var(--muted); }
</style>
</head>
<body>
  <div class="top">
    <a class="back" href="../../index.html">← Brain Lab</a>
    <div class="brand">🧠 2048</div>
  </div>
  <div class="wrap">
    <div class="header">
      <div>
        <h1>2048</h1>
        <p class="subtitle">訓練工作記憶與規劃能力</p>
      </div>
      <div class="scores">
        <div class="score-box"><div class="label">分數</div><div class="val" id="score">0</div></div>
        <div class="score-box"><div class="label">最佳</div><div class="val" id="best">0</div></div>
      </div>
    </div>
    <div class="toolbar">
      <button class="btn-primary" id="btnNew">新局</button>
      <button class="btn-ghost" id="btnUndo" disabled>復原</button>
    </div>
    <p class="hint">用<strong>方向鍵</strong>、<strong>滑動棋盤</strong>，或下方<strong>按鈕</strong>移動。相同數字碰撞會合併。目標：拼出 <b style="color:var(--warm)">2048</b>。</p>
    <div class="dpad" aria-label="方向控制">
      <button type="button" class="dpad-btn" data-dir="2" title="上">↑</button>
      <div class="dpad-mid">
        <button type="button" class="dpad-btn" data-dir="0" title="左">←</button>
        <button type="button" class="dpad-btn" data-dir="3" title="下">↓</button>
        <button type="button" class="dpad-btn" data-dir="1" title="右">→</button>
      </div>
    </div>
    <div class="board-wrap" id="boardWrap">
      <div class="board" id="boardBg">
        <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
        <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
        <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
        <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
      </div>
      <div class="tiles" id="tiles"></div>
      <div class="overlay" id="overlay">
        <div class="card">
          <h2 id="ovTitle"></h2>
          <p id="ovText"></p>
          <div class="row"><button id="ovBtn">再玩一局</button></div>
        </div>
      </div>
    </div>
    <p class="footer-note">Brain Lab · 休閒益智 · 非醫療診斷</p>
  </div>
<script>
'use strict';
const SIZE = 4;
const BEST_KEY = 'brainlab_2048_best';
let grid, score, best, won, over, history;
const $ = id => document.getElementById(id);
function emptyGrid() { return Array.from({ length: SIZE }, () => Array(SIZE).fill(0)); }
function cloneGrid(g) { return g.map(row => row.slice()); }
function loadBest() { try { return parseInt(localStorage.getItem(BEST_KEY) || '0', 10) || 0; } catch { return 0; } }
function saveBest() { try { localStorage.setItem(BEST_KEY, String(best)); } catch {} }
function emptyCells() {
  const cells = [];
  for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) if (!grid[r][c]) cells.push([r, c]);
  return cells;
}
function addRandom() {
  const cells = emptyCells();
  if (!cells.length) return;
  const [r, c] = cells[Math.floor(Math.random() * cells.length)];
  grid[r][c] = Math.random() < 0.9 ? 2 : 4;
}
function slideLine(line) {
  const filtered = line.filter(v => v);
  let gained = 0;
  const merged = [];
  for (let i = 0; i < filtered.length; i++) {
    if (i < filtered.length - 1 && filtered[i] === filtered[i + 1]) {
      const v = filtered[i] * 2; merged.push(v); gained += v; i++;
    } else merged.push(filtered[i]);
  }
  while (merged.length < SIZE) merged.push(0);
  return { line: merged, gained };
}
function move(dir) {
  const prev = cloneGrid(grid);
  let gained = 0, moved = false;
  const apply = (get, set) => {
    for (let i = 0; i < SIZE; i++) {
      let line = [];
      for (let j = 0; j < SIZE; j++) line.push(get(i, j));
      if (dir === 1 || dir === 3) line.reverse();
      const res = slideLine(line);
      if (dir === 1 || dir === 3) res.line.reverse();
      gained += res.gained;
      for (let j = 0; j < SIZE; j++) {
        if (get(i, j) !== res.line[j]) moved = true;
        set(i, j, res.line[j]);
      }
    }
  };
  if (dir === 0 || dir === 1) apply((i, j) => grid[i][j], (i, j, v) => { grid[i][j] = v; });
  else apply((i, j) => grid[j][i], (i, j, v) => { grid[j][i] = v; });
  if (!moved) return false;
  history.push({ grid: prev, score });
  if (history.length > 20) history.shift();
  score += gained;
  if (score > best) { best = score; saveBest(); }
  addRandom(); render(); checkEnd();
  return true;
}
function canMove() {
  if (emptyCells().length) return true;
  for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
    const v = grid[r][c];
    if (c + 1 < SIZE && grid[r][c + 1] === v) return true;
    if (r + 1 < SIZE && grid[r + 1][c] === v) return true;
  }
  return false;
}
function has2048() {
  for (const row of grid) for (const v of row) if (v >= 2048) return true;
  return false;
}
function checkEnd() {
  if (!won && has2048()) {
    won = true;
    showOverlay('🎉 達成 2048！', '分數 ' + score + '。可以繼續挑戰更高分，或開新局。');
  } else if (!canMove()) {
    over = true;
    showOverlay('遊戲結束', '沒有可移動的步數了。分數 ' + score + '。');
  }
}
function showOverlay(title, text) {
  $('ovTitle').textContent = title; $('ovText').textContent = text; $('overlay').classList.add('show');
}
function hideOverlay() { $('overlay').classList.remove('show'); }
function tileClass(v) { return v >= 4096 ? 't4096' : 't' + v; }
function render() {
  $('score').textContent = score; $('best').textContent = best;
  $('btnUndo').disabled = !history.length || over;
  const tilesEl = $('tiles'), board = $('boardBg'), gap = 8;
  const cellW = (board.clientWidth - gap * 3) / 4, cellH = (board.clientHeight - gap * 3) / 4;
  tilesEl.innerHTML = '';
  for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
    const v = grid[r][c]; if (!v) continue;
    const el = document.createElement('div');
    el.className = 'tile ' + tileClass(v); el.textContent = v;
    el.style.width = cellW + 'px'; el.style.height = cellH + 'px';
    el.style.left = (c * (cellW + gap)) + 'px'; el.style.top = (r * (cellH + gap)) + 'px';
    tilesEl.appendChild(el);
  }
}
function newGame() {
  grid = emptyGrid(); score = 0; won = false; over = false; history = [];
  hideOverlay(); addRandom(); addRandom(); render();
}
function undo() {
  if (!history.length || over) return;
  const prev = history.pop();
  grid = prev.grid; score = prev.score; won = has2048(); over = false;
  hideOverlay(); render();
}
window.addEventListener('keydown', e => {
  if (over && e.key.startsWith('Arrow')) return;
  const map = { ArrowLeft: 0, ArrowRight: 1, ArrowUp: 2, ArrowDown: 3 };
  if (e.key in map) { e.preventDefault(); move(map[e.key]); }
});
let tx = 0, ty = 0;
const boardWrap = $('boardWrap');
boardWrap.addEventListener('touchstart', e => {
  if (e.touches.length !== 1) return;
  tx = e.touches[0].clientX; ty = e.touches[0].clientY;
}, { passive: true });
boardWrap.addEventListener('touchend', e => {
  if (over) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - tx, dy = t.clientY - ty;
  const absX = Math.abs(dx), absY = Math.abs(dy);
  if (Math.max(absX, absY) < 24) return;
  if (absX > absY) move(dx > 0 ? 1 : 0); else move(dy > 0 ? 3 : 2);
}, { passive: true });
document.querySelectorAll('.dpad-btn').forEach(btn => {
  btn.addEventListener('click', () => { if (!over) move(parseInt(btn.getAttribute('data-dir'), 10)); });
});
$('btnNew').onclick = newGame; $('btnUndo').onclick = undo; $('ovBtn').onclick = newGame;
best = loadBest(); newGame();
window.addEventListener('resize', () => render());
</script>
</body>
</html>
